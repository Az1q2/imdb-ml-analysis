[project]
name = "imdb-ml-analysis"
version = "0.1.0"
description = "IMDb ML analysis: unsupervised anomaly detection and imbalanced rare-hit classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "imbalanced-learn>=0.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "notebook>=7.1.0",
]
